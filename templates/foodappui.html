<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodApp FAQ Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to right, #fff3e0, #ffe0b2);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chatbox {
      background-color: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      width: 360px;
      text-align: center;
    }

    h1 {
      color: #ff7043;
      margin-bottom: 20px;
    }

    .logo {
      width: 60px;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-bottom: 20px;
      background-color: #fff8f4;
    }

    .response-box {
      background-color: #fff3e0;
      padding: 15px;
      border-radius: 10px;
      border-left: 5px solid #ff7043;
      color: #333;
      display: none;
      text-align: left;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="chatbox">
    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png" alt="Food Logo">
    <h1>FoodBot Help</h1>

    <select id="faqDropdown" onchange="askQuestion()">
      <option value="">🍽️ Select a question</option>
      {% for question in questions %}
        <option value="{{ question }}">{{ question.capitalize() }}?</option>
      {% endfor %}
    </select>

    <div class="response-box" id="responseBox"></div>

    <footer>Powered by FoodApp AI 🍕</footer>
  </div>

  <script>
    function askQuestion() {
      const dropdown = document.getElementById("faqDropdown");
      const question = dropdown.value;
      const box = document.getElementById("responseBox");

      if (!question) {
        box.style.display = "none";
        return;
      }

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `question=${encodeURIComponent(question)}`
      })
      .then(response => response.json())
      .then(data => {
        box.textContent = data.response;
        box.style.display = "block";
      });
    }
  </script>
</body>
</html>
